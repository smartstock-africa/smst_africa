{% load static %}
{% load i18n %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Smst Apps{% endblock %}</title>
    {% include 'smst/smst_header.html' %}
    <link rel="stylesheet" href="https://static.smartstock.africa/js/cropper.min.css">
    <link rel="stylesheet" href="{% static 'app/app.min.css' %}" />
  </head>
  <body class="flex">
    <header>
      <div class="headerHolder flex ">
        <div class="headerLogo flex justify-center">
          <a class="headerLogoContainer" href="https://smst.smartstock.africa">
            <div id="headerLogo" class="flex align-center">
              <div class="headerLogoImageHolder">
                <img src="{{smst_logo}}" alt="The logo image for SmSt Africa" />
              </div>
              <div class="headerLogoText">
                <span>{% block headerTitle %}Smst Africa{% endblock %}</span>
              </div>
            </div>
          </a>
        </div>
        <div class="headerFunctionalityHolder flex align-center">
          <div class="functionalityHolder flex">
            <div class="appMessagesHolder">
              <div class="messageIconHolder">
                <div class="messageIcon">
                  <svg
                    width="24px"
                    height="24px"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M17.98 10.79V14.79C17.98 15.05 17.97 15.3 17.94 15.54C17.71 18.24 16.12 19.58 13.19 19.58H12.79C12.54 19.58 12.3 19.7 12.15 19.9L10.95 21.5C10.42 22.21 9.56 22.21 9.03 21.5L7.82999 19.9C7.69999 19.73 7.41 19.58 7.19 19.58H6.79001C3.60001 19.58 2 18.79 2 14.79V10.79C2 7.86001 3.35001 6.27001 6.04001 6.04001C6.28001 6.01001 6.53001 6 6.79001 6H13.19C16.38 6 17.98 7.60001 17.98 10.79Z"
                      stroke="#292D32"
                      stroke-width="1.5"
                      stroke-miterlimit="10"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                    <path
                      d="M21.98 6.79001V10.79C21.98 13.73 20.63 15.31 17.94 15.54C17.97 15.3 17.98 15.05 17.98 14.79V10.79C17.98 7.60001 16.38 6 13.19 6H6.79004C6.53004 6 6.28004 6.01001 6.04004 6.04001C6.27004 3.35001 7.86004 2 10.79 2H17.19C20.38 2 21.98 3.60001 21.98 6.79001Z"
                      stroke="#292D32"
                      stroke-width="1.5"
                      stroke-miterlimit="10"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                    <path
                      d="M13.4955 13.25H13.5045"
                      stroke="#292D32"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                    <path
                      d="M9.9955 13.25H10.0045"
                      stroke="#292D32"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                    <path
                      d="M6.4955 13.25H6.5045"
                      stroke="#292D32"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>
            <div class="profileHolder">
              <div class="profileIconHolder">
                <svg
                  width="24px"
                  height="24px"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M12.1601 10.87C12.0601 10.86 11.9401 10.86 11.8301 10.87C9.45006 10.79 7.56006 8.84 7.56006 6.44C7.56006 3.99 9.54006 2 12.0001 2C14.4501 2 16.4401 3.99 16.4401 6.44C16.4301 8.84 14.5401 10.79 12.1601 10.87Z"
                    stroke="#000000"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                  <path
                    d="M7.15997 14.56C4.73997 16.18 4.73997 18.82 7.15997 20.43C9.90997 22.27 14.42 22.27 17.17 20.43C19.59 18.81 19.59 16.17 17.17 14.56C14.43 12.73 9.91997 12.73 7.15997 14.56Z"
                    stroke="#000000"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </div>
            </div>
          </div>
          <div class="functionalityHelperHolder">
            <div class="helperHolder animate__animated">
              <div class="profileElementHolder  flex align-center">
                <div class="profilePhotoHolder"></div>
                <div class="profileDetailsHolder">
                  <div class="profileDetail">
                    <div class="profileName flex">
                      <div id="first_name"></div>
                      <div id="last_name"></div>
                    </div>
                    <div id="username"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
    
    <main>
      <div id="mainContent">
          {% block content %}
          {% endblock %}
      </div> 
    </main>
    
    <script nonce="{{csp_nonce}}" src="{% url 'javascript-catalog' %}"></script>
    <script type="module" nonce="{{csp_nonce}}" src="{% static 'js/app/app.prod.js' %}"></script>
    <script nonce="{{csp_nonce}}" src="https://static.smartstock.africa/js/cropper.min.js"></script>
    <script nonce="{{csp_nonce}}" src="https://static.smartstock.africa/js/jquery-cropper.min.js"></script>
    {% if request.user.is_authenticated %}
    <script>
        localStorage.setItem('access', '{{access}}')
        localStorage.setItem('refresh','{{refresh}}')
    </script>
    {% endif %}
  </body>
</html>
