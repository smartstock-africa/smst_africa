{% load i18n %}
<div id="appFormHolder" class="animate__animated animate__fadeInUp">
    <div class="appForm flex">
        <div class="app_form_content">
            <div id="create_form">
                <div class="formHeader">
                    <h1>{% translate 'Create A Product' %}</h1>
                </div> 
                <div class="formContent flex">
                    <div class="imageHolder">
                        <div class="productImage">
                            <input id="imageInput" hidden type="file" accept=".jpg,.jpeg">
                            <div class="imageEntity flex">
                                <div class="imagePreviewHolder animate__animated">
                                    <div class="imagePreview">
                                        <img id="imgPreview">
                                    </div>
                                </div>
                                <div class="addImageHolder">
                                    <div class="addImage flex align-center">
                                        <div class="addImageLogo">
                                            <svg width="30px" height="30px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M4.02693 18.329C4.18385 19.277 5.0075 20 6 20H18C19.1046 20 20 19.1046 20 18V14.1901M4.02693 18.329C4.00922 18.222 4 18.1121 4 18V6C4 4.89543 4.89543 4 6 4H18C19.1046 4 20 4.89543 20 6V14.1901M4.02693 18.329L7.84762 14.5083C8.52765 13.9133 9.52219 13.8482 10.274 14.3494L10.7832 14.6888C11.5078 15.1719 12.4619 15.1305 13.142 14.5865L15.7901 12.4679C16.4651 11.9279 17.4053 11.8856 18.1228 12.3484C18.2023 12.3997 18.2731 12.4632 18.34 12.5302L20 14.1901M11 9C11 10.1046 10.1046 11 9 11C7.89543 11 7 10.1046 7 9C7 7.89543 7.89543 7 9 7C10.1046 7 11 7.89543 11 9Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </div>
                                        <div class="addImageDetails">
                                            <span>{% translate 'Add Your Product Image' %}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="inputHolder">
                        <div class="inputLabel titleLabel">
                            <span>{% translate 'Product Name' %}</span>
                        </div>
                        <div class="inputInput">
                            <input type="text" id="productName" placeholder="{% translate 'Enter the name of your Product' %}">
                        </div>
                    </div>
                    <div class="inputHolder">
                        <div class="inputLabel titleLabel">
                            <span>{% translate 'Product Description' %}</span>
                        </div>
                        <div class="doubleInputHolder">
                            <div class="doubleInput flex">
                                <div class="dInputHolder flex">
                                    <div class="dInputLabel">
                                        <div>{% translate 'Description Type' %}</div>
                                    </div>
                                    <div class="dInput">
                                        <input type="text" id="descriptionType" placeholder="{% translate 'e.g Weight' %}">
                                    </div>
                                </div>
                                <div class="dInputHolder flex">
                                    <div class="dInputLabel">
                                        <div>{% translate 'Description Value' %}</div>
                                    </div>
                                    <div class="dInput">
                                        <input type="text" id="descriptionValue" placeholder="{% translate 'e.g 500g' %}">
                                    </div>
                                </div>
                            </div>
                            <div class="doubleInputButton">
                                <div class="dIButtonHolder flex">
                                    <button id="descriptionButton">{% translate 'Add Description' %}</button>
                                </div>
                            </div>
                        </div>
                    </div> 
                    <div class="productDescriptionHolder">
                        <input type="hidden" id="productDescriptionInput" >
                        <div class="productDescriptions ">
                        </div>
                    </div>
                </div>
                <div class="formButton">
                    <div class="formButtonHolder flex">
                        <button id="createProductButton">{% translate 'Create Product' %}</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="imageEditHolder animate__animated">
    <div class="imageEdit animate__animated">
        <div class="imageEditContainer flex">
            <div class="editImage">
                <div class="editImageHolder">
                    <img id="imageEditPreview">
                </div>
            </div>
            <div class="imageEditButtonHolder flex">
                <div class="imageEditButton flex" style="flex-grow: 0.5">
                    <button id="cancelEditing" class="secondary-button">{% translate 'Cancel' %}</button>
                </div>
                <div class="imageEditButton flex" style="flex-grow: 1">
                    <button id="saveEditing" class="positive-button">{% translate 'Save' %}</button>
                </div>
            </div>
        </div>
    </div>
</div>
