<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{subject}}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- Preheader text (won't display in body but shows in inbox preview) -->
    <style>
      /* Minimal mobile responsiveness that many email clients respect */
      @media only screen and (max-width: 600px) {
        .container {
          width: 100% !important;
        }
        .stack {
          display: block !important;
          width: 100% !important;
        }
        .hide-mobile {
          display: none !important;
        }
        .center {
          text-align: center !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      background: #f4f6f8;
    "
  >
    <!-- Outer wrapper -->
    <table
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      role="presentation"
    >
      <tbody>
        <tr>
          <td>
            <table
              cellpadding="0"
              cellspacing="0"
              border="0"
              width="100%"
              role="presentation"
              style="
                max-width: 37.5em;
                margin-left: auto;
                margin-right: auto;
                margin-top: 12px;
                margin-bottom: 12px;
              "
            >
              <tbody>
                <tr>
                  <td>
                    <table
                      cellpadding="0"
                      cellspacing="0"
                      border="0"
                      width="100%"
                      role="presentation"
                    >
                      <tbody>
                        <tr>
                          <td>
                            <div
                              style="
                                padding: 8px 12px;
                                border-top-left-radius: 16px;
                                border-top-right-radius: 16px;
                                overflow: hidden;
                                background-color: #3b668c;
                                background-image: url(https://res.cloudinary.com/di3bh4qsl/image/upload/v1785910106/New_Project_1_cmpwri.png);
                                background-size: cover;
                              "
                            >
                              <table
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                width="100%"
                                role="presentation"
                              >
                                <tbody>
                                  <tr>
                                    <td>
                                      <div>
                                        <img
                                          style="width: 50px"
                                          src="https://res.cloudinary.com/di3bh4qsl/image/upload/v1780683254/latest_smst_home_logo_jhgxoc.png"
                                        />
                                      </div>
                                    </td>
                                  </tr>
                                </tbody>
                              </table>
                              <table
                                cellpadding="0"
                                cellspacing="0"
                                border="0"
                                width="100%"
                                role="presentation"
                              >
                                <tbody>
                                  <tr>
                                    <td>
                                      <p
                                        style="
                                          font-family:
                                            &quot;Trebuchet MS&quot;,
                                            &quot;Lucida Sans Unicode&quot;,
                                            &quot;Lucida Grande&quot;,
                                            &quot;Lucida Sans&quot;, Arial,
                                            sans-serif;
                                          font-size: 1.35rem;
                                          font-weight: bold;
                                          color: white;
                                        "
                                      >
                                        Hello, Welcome to Smartstock
                                      </p>
                                    </td>
                                  </tr>
                                </tbody>
                              </table>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                    <table
                      cellpadding="0"
                      cellspacing="0"
                      border="0"
                      width="100%"
                      role="presentation"
                      style="background: white"
                    >
                      <tbody>
                        <tr>
                          <td>
                            <table
                              cellpadding="0"
                              cellspacing="0"
                              border="0"
                              width="100%"
                              role="presentation"
                            >
                              <tbody>
                                <tr>
                                  <td>
                                    <div style="padding: 12px">
                                      {% block content %}{% endblock %}

                                      
                                    </div>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                            <table
                              cellpadding="0"
                              cellspacing="0"
                              border="0"
                              width="100%"
                              role="presentation"
                            >
                              <tbody>
                                <tr>
                                  <td></td>
                                </tr>
                              </tbody>
                            </table>
                            <table
                              cellpadding="0"
                              cellspacing="0"
                              border="0"
                              width="100%"
                              role="presentation"
                              style="
                                text-align: center;
                                font-family:
                                  &quot;Lucida Sans&quot;,
                                  &quot;Lucida Sans Regular&quot;,
                                  &quot;Lucida Grande&quot;,
                                  &quot;Lucida Sans Unicode&quot;, Geneva,
                                  Verdana, sans-serif;
                                padding: 12px;
                              "
                            >
                              <tbody>
                                <tr>
                                  <td>
                                    <table
                                      cellpadding="0"
                                      cellspacing="0"
                                      border="0"
                                      width="100%"
                                      role="presentation"
                                    >
                                      <tbody>
                                        <tr>
                                          <td>
                                            <span
                                              >This message was sent to
                                              <a
                                                href="mailto:{{email}}"
                                                style="color: #3b668c"
                                                >{{email}}</a
                                              >
                                            </span>
                                          </td>
                                        </tr>
                                      </tbody>
                                    </table>
                                    <table
                                      cellpadding="0"
                                      cellspacing="0"
                                      border="0"
                                      width="100%"
                                      role="presentation"
                                    >
                                      <tbody>
                                        <tr>
                                          <td>
                                            <p style="direction: ltr">
                                              <a
                                                style="color: #3b668c"
                                                href="https://smartstock.africa/legal/privacypolicy"
                                                >Privacy Policy</a
                                              >
                                              |
                                              <a
                                                style="color: #3b668c"
                                                href="https://smartstock.africa/legal/termsofservice"
                                                >Terms of Service</a
                                              >
                                            </p>
                                          </td>
                                        </tr>
                                      </tbody>
                                    </table>
                                    <table
                                      cellpadding="0"
                                      cellspacing="0"
                                      border="0"
                                      width="100%"
                                      role="presentation"
                                    >
                                      <tbody>
                                        <tr>
                                          <td>
                                            <div>
                                              <img
                                                style="width: 36px"
                                                src="https://res.cloudinary.com/di3bh4qsl/image/upload/v1780683254/latest_smst_home_logo_jhgxoc.png"
                                              />
                                            </div>
                                          </td>
                                        </tr>
                                      </tbody>
                                    </table>
                                  </td>
                                </tr>
                              </tbody>
                            </table>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
