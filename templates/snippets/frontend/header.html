<header>
  <div id="headerContainer">
    <div id="header">
      <a class="headerLogoContainer" href="https://smst.smartstock.africa">
        <div id="headerLogo" class="flex align-center">
          <div class="headerLogoImageHolder">
            <img
              src="https://res.cloudinary.com/di3bh4qsl/image/upload/v1780517418/latest_smst_logo_1_vrlvwa.png"
              alt="The logo image for SmSt Africa"
            />

      </a>

              </div>
            </div>
          </div>

        <div class="headerCTAButton">
